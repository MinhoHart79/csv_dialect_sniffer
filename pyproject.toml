[project]
name = "csv-dialect-sniffer"
version = "0.1.1"
description = "Replaces the standard csv.Sniffer with a deterministic, transparent delimiter, quote, and escape detector."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
